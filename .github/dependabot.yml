version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /
      - /config/terraform
      - /config/vault
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      docker-compose-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: terraform
    directory: /config/terraform
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    groups:
      terraform-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
