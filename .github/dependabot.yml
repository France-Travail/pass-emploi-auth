version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /
      - /config/terraform
      - /config/vault
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      docker-major:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    # Image qui double l'addon Scalingo : sa version suit celle de la prod, pas la dernière publiée
    ignore:
      - dependency-name: 'postgres'
    cooldown:
      default-days: 3
    groups:
      docker-compose-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      docker-compose-major:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: terraform
    directory: /config/terraform
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'chore(deps):'
    cooldown:
      default-days: 3
    groups:
      terraform-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      terraform-major:
        applies-to: version-updates
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci(deps):'
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - patch
          - minor
      actions-major:
        applies-to: version-updates
        update-types:
          - major
